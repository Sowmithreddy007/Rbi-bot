name: RBI Notification Bot

on:
  schedule:
    - cron: '30 2 * * *'   # 8:00 AM IST
  workflow_dispatch:

jobs:
  fetch-and-notify:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 lxml sumy

      - name: Download NLTK data (punkt tokenizer)
        run: python -c "import nltk; nltk.download('punkt_tab')"

      - name: Run RBI scraper
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scraper.py

      - name: Commit updated seen.json
        run: |
          git config user.name  "rbi-bot[bot]"
          git config user.email "rbi-bot@users.noreply.github.com"
          git add seen.json
          git diff --staged --quiet || git commit -m "chore: update seen notifications [skip ci]"
          git push
